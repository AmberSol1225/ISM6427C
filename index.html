<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the page paints to avoid a flash
    (function () {
      var pref = "system";
      try { pref = localStorage.getItem("theme") || "system"; } catch (e) {}
      if (pref === "system") pref = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = pref;
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="top">
      <p id="greeting" class="greeting">Hello, Amber Figueroa</p>
      <div class="glass theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light">☀️ Light</button>
        <button type="button" data-theme-choice="dark">🌙 Dark</button>
        <button type="button" data-theme-choice="system">💻 System</button>
      </div>
    </header>

    <form id="search-form" class="glass search">
      <input id="search-input" type="text" placeholder="Search city…" autocomplete="off" aria-label="Search city">
      <button type="submit" aria-label="Search">🔍</button>
    </form>

    <section class="current">
      <h1 id="location">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition" class="condition">Loading…</div>
      <div id="hilo" class="hilo"></div>
    </section>

    <section class="glass card">
      <h2>Hourly forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass card">
      <h2>7-day forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <section class="details">
      <div class="glass tile"><h2>Feels like</h2><p id="feels">--</p></div>
      <div class="glass tile"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass tile"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass tile"><h2>UV index</h2><p id="uv">--</p></div>
    </section>

    <p id="error" class="error" hidden></p>
    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
